version: "2.1"
services:
  server:
    image: jetbrains/teamcity-server:${TEAMCITY_VERSION}
    ports:
      - "8047:8111"
    volumes:
      - ./datadir:/data/teamcity_server/datadir
      - ./logs:/opt/teamcity/logs
      - ${JAVA_HOME_PATH}:/opt/java/jdk

  agent_1:
    image: jetbrains/teamcity-agent:${TEAMCITY_VERSION}-sudo
    volumes:
      - ./agents/agent_conf1:/data/teamcity_agent/conf
      - ${JAVA_HOME_PATH}:/opt/java/jdk           
    environment:
      - SERVER_URL=http://server:8111

  agent_2:                                                                                                                                           
    image: jetbrains/teamcity-agent:${TEAMCITY_VERSION}-sudo                                                                                     
    volumes:                                                                                                                                          
      - ./agents/agent_conf2:/data/teamcity_agent/conf        
      - ${JAVA_HOME_PATH}:/opt/java/jdk      
    environment:
      - SERVER_URL=http://server:8111

  agent_3:
    image: jetbrains/teamcity-agent:${TEAMCITY_VERSION}-sudo                                                                                
    volumes:
      - ./agents/agent_conf3:/data/teamcity_agent/conf                                                                                      
      - ${JAVA_HOME_PATH}:/opt/java/jdk
    environment:
      - SERVER_URL=http://server:8111

